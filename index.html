<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama Alert — Status dos testes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">SEPLANE · Paulo Afonso</p>
      <h1>Panorama Alert</h1>
      <p class="lede">
        Monitoramento dos processos de teste do
        <a id="target-link" href="https://panorama.pauloafonso.ba.gov.br" target="_blank" rel="noreferrer">Panorama Municipal</a>.
      </p>
      <p class="meta" id="generated-at">Carregando última execução…</p>
    </header>

    <section class="summary" id="summary" aria-label="Resumo"></section>

    <section class="processes" aria-labelledby="processes-title">
      <div class="section-head">
        <h2 id="processes-title">Processos</h2>
        <p>Cada card é um teste: status, passos e erros encontrados.</p>
      </div>
      <div id="process-list" class="process-list"></div>
      <p id="empty-state" class="empty" hidden></p>
    </section>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
